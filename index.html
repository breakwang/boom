<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽奖游戏</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🎰 在线刮刮乐彩票 🎰</h1>
        
        <!-- 创建奖池区域 -->
        <div class="setup-panel" id="setupPanel">
            <div class="card">
                <h2>购买彩票</h2>
                <div class="form-group">
                    <label for="playerCount">购买张数：</label>
                    <input type="number" id="playerCount" min="1" value="10" placeholder="输入购买张数">
                </div>
                <div class="form-group">
                    <label for="pointsPerPlayer">票单价：</label>
                    <input type="number" id="pointsPerPlayer" min="10" step="10" value="100" placeholder="输入票单价（10的倍数）">
                </div>
                <div class="form-group">
                    <label for="winRate">中奖概率：</label>
                    <input type="range" id="winRate" min="0" max="100" value="70">
                    <span class="variance-label">
                        <span id="winRateValue">70</span>% 
                        <span class="variance-hint">(回本率：投入100元预期中奖70元)</span>
                    </span>
                </div>
                <div class="form-group">
                    <label for="variance">奖金差距：</label>
                    <input type="range" id="variance" min="0" max="100" value="50">
                    <span class="variance-label">
                        <span id="varianceValue">50</span>% 
                        <span class="variance-hint">(0=奖金均匀, 100=超级大奖)</span>
                    </span>
                </div>
                <div class="total-display">
                    总投入金额: <span id="totalPoints">1000</span> 元
                </div>
                <button class="btn btn-primary" onclick="createPrizePool()">购买彩票</button>
            </div>
        </div>

        <!-- 刮奖区域 -->
        <div class="game-panel" id="gamePanel" style="display: none;">
            <div class="card">
                <div class="pool-info">
                    <div class="info-item">
                        <span class="label">总投入:</span>
                        <span class="value" id="gameTotalPoints">0</span>
                    </div>
                    <div class="info-item">
                        <span class="label">剩余彩票:</span>
                        <span class="value" id="remainingDraws">0</span>
                    </div>
                    <div class="info-item">
                        <span class="label">已中奖:</span>
                        <span class="value highlight" id="earnedPoints">0</span>
                    </div>
                </div>
                
                <div class="prizes-grid" id="prizesGrid">
                    <!-- 奖项编号将动态生成 -->
                </div>

                <div class="actions">
                    <button class="btn btn-secondary" onclick="resetGame()">重新开始</button>
                    <button class="btn btn-info" onclick="revealAll()">揭晓所有</button>
                </div>
            </div>

            <!-- 中奖历史 -->
            <div class="card history-card" id="historyCard" style="display: none;">
                <h3>刮奖记录</h3>
                <div class="history-list" id="historyList">
                    <!-- 历史记录将动态生成 -->
                </div>
            </div>
        </div>

        <!-- 动画效果容器 -->
        <div class="confetti-container" id="confettiContainer"></div>
        
        <!-- 状态指示器 -->
        <div class="status-indicator" id="statusIndicator">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">连接中...</span>
            <span class="online-count" id="onlineCount">0人在线</span>
        </div>
    </div>

    <!-- Socket.IO 客户端库 -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
